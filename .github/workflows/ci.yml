name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ main ]

jobs:
  build:
    uses: Platform-System/CI-CD/.github/workflows/build-dotnet.yml@main
    secrets: inherit
    with:
      project_path: 'Api.csproj'
      test_path: 'Api.Tests/Api.Tests.csproj'



